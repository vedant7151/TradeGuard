services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeguard-postgres
    environment:
      POSTGRES_DB: tradeguard
      POSTGRES_USER: tradeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tradeguard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  sut-api:
    build:
      context: ./sut-api
    container_name: tradeguard-sut-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeguard
      SPRING_DATASOURCE_USERNAME: tradeguard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tradeguard}
      TRADEGUARD_CORS_ORIGINS: ${DASHBOARD_ORIGIN:-http://localhost:5173}
      TRADEGUARD_SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  frontend-dashboard:
    build:
      context: ./frontend-dashboard
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: tradeguard-dashboard
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    depends_on:
      sut-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tradeguard-pgdata:

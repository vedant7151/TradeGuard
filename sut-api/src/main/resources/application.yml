server:
  port: 8080

spring:
  application:
    name: tradeguard-sut-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tradeguard}
    username: ${SPRING_DATASOURCE_USERNAME:tradeguard}
    password: ${SPRING_DATASOURCE_PASSWORD:tradeguard}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always

logging:
  level:
    com.tradeguard: INFO

server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: tradeguard-sut-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tradeguard}
    username: ${SPRING_DATASOURCE_USERNAME:tradeguard}
    password: ${SPRING_DATASOURCE_PASSWORD:tradeguard}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

tradeguard:
  # Creates a "Demo Portfolio" on first start when no portfolio exists.
  seed-demo-data: ${TRADEGUARD_SEED_DEMO_DATA:true}
  demo-cash-balance: ${TRADEGUARD_DEMO_CASH:100000}
  cors-allowed-origins: ${TRADEGUARD_CORS_ORIGINS:*}

# In-memory profile used by BDD, Selenium and performance runs (no external DB needed).
spring:
  datasource:
    url: jdbc:h2:mem:tradeguard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false
